[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "noteforge"
version = "5.3.0"
description = "Intelligent note forging: video/audio → ASR → LLM notes with 12-dim quality gate"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "NoteForge" }]

dependencies = [
    "requests>=2.33",
    "PyYAML>=6.0",
    "tiktoken>=0.12",
    "jieba>=0.42",
    "yt-dlp",
    "pytest>=8.0",
]

[project.optional-dependencies]
asr = [
    "funasr==1.3.1",
    "soundfile>=0.12",
]
feishu = [
    "lark-cli",
]

[project.scripts]
noteforge = "noteforge.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["noteforge*"]

[tool.pytest.ini_options]
testpaths = ["video-to-text/tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py310"
