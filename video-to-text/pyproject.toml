[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "noteforge"
version = "5.3.0"
description = "Intelligent note forging: video/audio → ASR → LLM notes with 12-dim quality gate"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "NoteForge" }]

dependencies = [
    "requests>=2.33",
    "PyYAML>=6.0",
    "tiktoken>=0.12",
    "jieba>=0.42",
    "yt-dlp",
    "pytest>=8.0",
]

[project.optional-dependencies]
asr = [
    "funasr==1.3.1",
    "soundfile>=0.12",
]
feishu = [
    "lark-cli",
]

[project.scripts]
noteforge = "noteforge.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["noteforge*"]

[tool.pytest.ini_options]
testpaths = ["video-to-text/tests"]
addopts = "-v --tb=short"
markers = [
    "integration: cross-module integration tests (may use file I/O, threading, mocks)",
    "slow: tests that take significant time (ASR, real LLM calls)",
    "chaos: chaos/resilience tests (simulating kills, disk full, API revocation)",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports, undefined names)
    "D",    # pydocstyle (docstring conventions)
    "ICN",  # import conventions
    "RUF",  # Ruff-specific rules
    "F811", # redefined-while-unused（检测重复方法定义）
]
ignore = [
    "D100",  # missing docstring in module
    "D104",  # missing docstring in package
    "D107",  # missing docstring in __init__
    "D203",  # blank line before class docstring (conflicts with D211)
    "D213",  # multi-line docstring summary on second line (conflicts with D212)
]

# 防止重复方法定义（manager.py 事件的根因）
[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.isort]
known-first-party = ["noteforge"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]  # tests don't need docstrings
