# ============================================================
# 笔记生成规则文件 v1.0
# 用途: 每次生成视频学习笔记时，将此文件作为硬约束注入 prompt
# 更新方式: 每次复查发现新错误模式后追加规则
# 最后更新: 2026-05-08
# ============================================================

meta:
  version: "1.0"
  created: "2026-05-08"
  source: "基于 STUDY_NOTES.md 的6类错误模式提炼"
  usage: "每次生成笔记前，完整读取此文件并严格遵守所有规则"

# ----------------------------------------------------------
# 核心生成规则
# ----------------------------------------------------------
rules:

  R1_禁止虚构数据:
    id: "R1"
    severity: "fatal"
    description: >
      所有数字、百分比、权重、排名、金额必须在原文中有确切出处。
      原文仅为定性描述的，不得自行量化。
      原文说"压力比较大"时，不得编造"压力占40%"。
    violations:
      - "自创百分比权重"
      - "原文无此数字却用数字量化"
      - "将模糊描述精确化"
    compliance_check: >
      笔记中每个数字后标注"(原文段落: Lxxx-Lxxx)"；
      无法标注的数字必须删除或改为定性描述。

  R2_禁止越界增补:
    id: "R2"
    severity: "fatal"
    description: >
      不得添加原文嘉宾/主持人未说过的话、未给出的建议、未发表的观点。
      如需补充行业背景知识或个人理解，必须用明确标记区分来源。
    violations:
      - "添加原文不存在的应对策略建议"
      - "添加原文不存在的投资建议"
      - "添加原文不存在的观点断言"
    mark_format: "[📝笔者补充] 此处为笔者基于行业常识的补充说明，非原文内容"

  R3_禁止事实反转:
    id: "R3"
    severity: "fatal"
    description: >
      提炼时不得翻转原文的语义方向。
      特别注意涉及"强弱""好坏""是否""多少"等对比性描述的句子。
    violations:
      - "原文说'多数因子不可解释'，写成'量化可解释性强'"
      - "原文说'A不如B'，写成'A优于B'"
      - "原文说'难度很高'，写成'相对容易'"
    compliance_check: >
      每个核心论点必须能在原文中找到至少一处直接对应的原文句子。

  R4_禁止关键概念简化失真:
    id: "R4"
    severity: "major"
    description: >
      专业术语、策略定义、投资框架等核心概念的描述，必须保留原文的全部关键限定词。
      不得因为追求简洁而丢失核心修饰语，导致概念含义偏移。
    violations:
      - "T0策略=中低频长周期预测 → 简化为'日内回转交易'(丢失核心定位)"
      - "周期投资=关注ROE趋势向上+基本面趋势 → 简化为'逆向思维'(完全不准确)"
    compliance_check: >
      检查笔记中每个策略/概念的描述是否保留了原文的关键限定词。

  R5_覆盖度底线:
    id: "R5"
    severity: "major"
    description: >
      笔记必须覆盖原文每个主要议题/章节的至少一个核心论点。
      原文如有13个章节速览，笔记至少应覆盖其中80%（即至少10个章节的核心论点）。
      单个议题的遗漏是允许的，但大面积遗漏（超过20%）为不合格。
    violations:
      - "原文13个章节速览，笔记仅覆盖5个（遗漏60%）"
      - "碳酸锂案例、铜AI需求、周期vs价值差异等关键议题完全丢失"
    compliance_check: >
      生成后列出原文章节清单与笔记覆盖对照表。

  R6_术语一致性:
    id: "R6"
    severity: "medium"
    description: >
      笔记中术语表的定义，必须与正文中使用该术语时的语义方向一致。
      术语表和正文应视为一个整体，不得出现"术语表说东、正文说西"的矛盾。
    violations:
      - "术语表:因子=不可解释为主 / 正文:量化可解释性强于主观交易"
    compliance_check: >
      检查术语表中的关键词是否在正文中有矛盾表述。

  R7_框架完整性:
    id: "R7"
    severity: "major"
    description: >
      提取的框架/模型必须包含原文提到的全部组成要素。
      不得因简化而丢失关键步骤或条件。
      如果原文描述了一个 5 步流程，框架中必须包含全部 5 步，不得精简为 3 步。
    violations:
      - "原文描述了八步学习法，笔记只提取了五步"
      - "框架丢失了关键的限定条件（如'至少三遍'被省略）"
    compliance_check: >
      对照原文逐一检查框架的每个组成要素是否有出处。

  R8_洞察可行动性:
    id: "R8"
    severity: "major"
    description: >
      每条"洞察"必须包含具体行动指引（做什么、何时做、预期效果）。
      禁止只写"要重视XX""注意XX"这类空洞总结。
      好的洞察 = 触发条件 + 具体行动 + 预期结果。
    violations:
      - "写'要培养导演思维'但没有说明怎么培养"
      - "写'注重内容质量'但没有可操作的步骤"
    compliance_check: >
      检查每条洞察是否能回答"具体怎么做？"这个问题。

  R9_分层准确性:
    id: "R9"
    severity: "medium"
    description: >
      必须区分"表面内容"（具体案例、故事、数据）和
      "可迁移知识"（原则、框架、思维模型）。
      不得将个案经验包装为通用原则。
      个案结论必须标注适用范围和限制条件。
    violations:
      - "讲师的个人成功经验被写成'所有人都应该这样做'"
      - "特定行业的案例被直接套用到其他行业"
    compliance_check: >
      检查每个"原则/模型"是否标注了适用范围，是否区分了案例和通用知识。

# ----------------------------------------------------------
# Prompt模板（生成笔记时使用）
# 注意: 实际 prompt 由 prompt_builder.py 程序化组装，此模板仅供参考
# ----------------------------------------------------------
prompt_template: |
  你是一位专业的知识提炼专家。请根据以下转写文本生成结构化的学习笔记。

  ## 硬约束（不可违反）
  1. {R1} 所有数字必须有原文出处，禁止编造
  2. {R2} 禁止添加原文不存在的内容；补充资料须标注"[📝笔者补充]"
  3. {R3} 禁止翻转原文语义方向
  4. {R4} 专业概念必须保留原文的关键限定词
  5. {R5} 笔记覆盖原文至少80%的议题
  6. {R6} 术语定义与正文使用保持一致
  7. {R7} 提取的框架不得丢失关键组成要素
  8. {R8} 洞察必须包含具体行动指引（做什么、何时做、预期效果）
  9. {R9} 区分个案经验和通用原则，标注适用范围

  ## 经验教训（来自历史错误）
  {experience_log_content}

  ## 输出格式
  - 核心观点（按时间线或主题分段，每个观点标注原文出处）
  - 知识框架提炼（可迁移的框架/模型，含组成要素和适用场景）
  - 可迁移洞察（表格：洞察→做什么→何时用→预期效果）
  - 行动清单（`- [ ]` 格式）
  - 金句摘录（`>` 引用格式）
  - 覆盖度自检清单（对照原文章节列表自查）
