# ============================================================
# NoteForge LLM 笔记引擎配置 v1.0
# 用途: 控制 LLM 提供商、质量阈值、重试策略、输入输出路径
# 最后更新: 2026-06-12
# ============================================================

meta:
  version: "1.0"
  description: "LLM笔记生成引擎配置"

# LLM 提供商配置
# type 可选: claude | openai | local
provider:
  type: "claude"

  claude:
    model: "claude-sonnet-4-20250514"
    api_key_env: "ANTHROPIC_API_KEY"  # 从环境变量读取
    api_key: "PROXY_MANAGED"          # 直接指定（优先于 api_key_env，代理模式用此值）
    base_url: "http://127.0.0.1:15721"  # 本地代理（直连 Anthropic 改为 https://api.anthropic.com）
    max_tokens: 8192
    temperature: 0.3  # 低温度以提高忠实度

  openai:
    model: "gpt-4o"
    api_key_env: "OPENAI_API_KEY"
    base_url: "https://api.openai.com/v1"
    max_tokens: 8192
    temperature: 0.3

  local:
    model: "qwen2.5-72b"
    base_url: "http://localhost:11434/v1"  # Ollama 兼容接口
    max_tokens: 8192
    temperature: 0.3
    api_key: "not-needed"

# 生成质量控制
quality:
  min_score: 0.80            # 最低通过分数
  max_retries: 2             # 最大重试次数（总尝试 = 1 + max_retries）
  retry_temperature_delta: 0.1  # 每次重试温度增加
  fatal_rules_must_pass: true   # R1/R2/R3 必须全部通过

# 转写文本处理
transcript:
  max_tokens_per_call: 50000    # 单次调用最大 token
  chunk_overlap_tokens: 500     # 分块重叠
  min_chunk_size_tokens: 5000   # 最小分块大小
  clean_unrecognized: true      # 清除 [无法识别片段] 标记
  clean_timestamps: true        # 清除 [HH:MM:SS] 时间戳前缀
  clean_fillers: true           # 清除口语填充词（嗯、啊、那个）

# 输入输出路径（相对于 video-to-text/）
paths:
  rules: "config/note_generation_rules.yaml"
  experience: "config/experience_log.yaml"
  transcripts_dir: "output/transcripts"
  notes_dir: "output/notes"
  reports_dir: "output/quality_reports"
  format_example: "output/notes/第01集-偷是所有大师的第一步.md"

# 日志
logging:
  level: "INFO"  # DEBUG | INFO | WARNING | ERROR
  save_intermediate: true   # 保存每次 LLM 调用的原始输出
  log_dir: "output/logs"

# API 调用重试（网络层，区别于质量重试）
api_retry:
  max_attempts: 3
  base_delay: 10              # 初始退避秒数
  max_delay: 120              # 最大退避秒数

# 飞书知识库同步配置
feishu:
  enabled: true                     # 总开关（默认关闭，不影响现有流程）
  auto_sync: false                  # 笔记生成后自动同步
  space_id: "7650684490813017052"   # 知识库 space_id（替换为你自己的）
  root_node_token: "GnAZwwhNtiV5AmkFl8XcWUeKncd"  # 根节点（替换为你自己的）

  # 排除的文件模式（不同步到飞书）
  exclude_patterns:
    - "Rick Astley*"                # YouTube 测试
    - "bilibili*"                   # B站测试
    - "*test*"
    - "*测试*"

  # 分类结构（二级分类 + 内部固定子结构）
  # root_node_token → AI笔记库（固定不变）
  # 每个二级分类内部统一有：
  #   逐集笔记 — 每篇独立笔记，持续增长
  #   跨集提炼 — 知识体系，随新笔记不断丰富
  # 新增主题只需加一条 match 规则
  categories:
    - name: "短视频导演课程"
      match: ["*第*集*", "*导演*", "*短视频*", "*拍摄*", "*剪辑*", "*翟东升*"]
    - name: "其他笔记"
      match: ["*"]

  # API 参数
  api_interval: 0.5                 # 请求间隔（秒）
  block_batch_size: 50              # 每批写入 block 上限
