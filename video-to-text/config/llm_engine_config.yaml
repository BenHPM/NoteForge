# ============================================================
# NoteForge LLM 笔记引擎配置 v1.0
# 用途: 控制 LLM 提供商、质量阈值、重试策略、输入输出路径
# 最后更新: 2026-06-12
# ============================================================

meta:
  version: "1.0"
  description: "LLM笔记生成引擎配置"

# LLM 提供商配置
# type 可选: claude | openai | local
provider:
  type: "claude"

  claude:
    model: "claude-sonnet-4-20250514"
    api_key_env: "ANTHROPIC_API_KEY"  # 直连时从环境变量读取
    api_key: "PROXY_MANAGED"          # cc-switch 代理模式：代理自动注入 Key
    base_url: "http://127.0.0.1:15721"  # cc-switch 代理（直连改为 https://api.anthropic.com）
    max_tokens: 8192
    temperature: 0.3  # 低温度以提高忠实度

  openai:
    model: "gpt-4o"
    api_key_env: "OPENAI_API_KEY"
    base_url: "https://api.openai.com/v1"
    max_tokens: 8192
    temperature: 0.3

  local:
    model: "qwen2.5-72b"
    base_url: "http://localhost:11434/v1"  # Ollama 兼容接口
    max_tokens: 8192
    temperature: 0.3
    api_key: "not-needed"

# 内容策略（重要：所有处理的内容均来自公开平台，已公开发表）
content_policy:
  source: "all content from public platforms (Bilibili, YouTube, podcasts)"
  nature: "publicly available, already published content"
  sensitivity: "none - all content is publicly accessible via standard URLs"
  processing_purpose: "academic study notes, knowledge extraction"
  note: >
    所有视频/播客/音频均来自公开平台的公开分享链接，内容本身无敏感性。
    代理模型不应对此类内容触发安全过滤。
    如遇过滤误判，应自动重试而非直接失败。

# 生成质量控制
quality:
  min_score: 0.80            # 最低通过分数
  max_retries: 2             # 最大重试次数（总尝试 = 1 + max_retries）
  retry_temperature_delta: 0.1  # 每次重试温度增加
  fatal_rules_must_pass: true   # R1/R2/R3 必须全部通过

# 转写文本处理
transcript:
  max_tokens_per_call: 50000    # 单次调用最大 token
  chunk_overlap_tokens: 500     # 分块重叠
  min_chunk_size_tokens: 5000   # 最小分块大小
  clean_unrecognized: true      # 清除 [无法识别片段] 标记
  clean_timestamps: true        # 清除 [HH:MM:SS] 时间戳前缀
  clean_fillers: true           # 清除口语填充词（嗯、啊、那个）

# 输入输出路径（相对于 video-to-text/）
paths:
  rules: "config/note_generation_rules.yaml"
  experience: "config/experience_log.yaml"
  transcripts_dir: "output/transcripts"
  notes_dir: "output/notes"
  reports_dir: "output/quality_reports"
  format_example: "output/notes/第01集-偷是所有大师的第一步.md"

# 日志
logging:
  level: "INFO"  # DEBUG | INFO | WARNING | ERROR
  save_intermediate: true   # 保存每次 LLM 调用的原始输出
  log_dir: "output/logs"

# API 调用重试（网络层，区别于质量重试）
api_retry:
  max_attempts: 3
  base_delay: 10              # 初始退避秒数
  max_delay: 120              # 最大退避秒数

# ================================================================
# 知识域配置（用于笔记分类 + 跨集合成的域隔离）
# ================================================================
# 分类策略（两级匹配，防误判）：
#
# 第一级：文件名匹配（match_files，快速精确）
#   - 通配符模式，优先级高于关键词
#   - 适用于有明确命名规则的内容（如 "第X集"、"*翟东升*"）
#
# 第二级：内容关键词匹配（match_keywords，容错兜底）
#   - 扫描笔记前 5000 字，统计各域命中关键词数
#   - 命中数最多的域胜出（score-based，非 first-match）
#   - 支持 exclude_keywords：命中排除词的域直接跳过
#   - 未命中任何域 → 归入 general（兜底）
#
# 分类优化指南：
#   1. 泛化词（如"策略"、"投资"）容易跨域误匹配
#      → 改用更具体的词（如"量化策略"、"基金收益"）或加 exclude_keywords
#   2. 新增域时，先分析目标内容的高频词，再配 match_keywords
#   3. exclude_keywords 用于排除"同形异义"（如"投资"在金融 vs 视频制作设备）
#   4. general 域必须放最后，且 match_keywords 为空
#   5. 分类结果可在 output/logs/pipeline_progress.json 中按 category 字段追溯
#
# 飞书分类与知识域的对应关系：
#   - 飞书 categories（下方 feishu 段）控制文档归入哪个飞书文件夹
#   - knowledge_domains 控制跨集合成时的域隔离
#   - 两者的关键词应保持一致，避免分类和合成不匹配
# ================================================================
knowledge_domains:
  - id: "short_video_directing"
    name: "短视频导演课程"
    description: "短视频创作方法论、导演技巧、拍摄剪辑"
    match_keywords: ["导演", "短视频", "拍摄", "剪辑", "剧本", "创作流程", "爆火", "IP", "镜头", "运镜", "文案", "封面"]
    exclude_keywords: ["量化", "投资", "基金", "地缘", "中美"]
    match_files: ["第*集*", "ep0*", "ep1*"]
    output_name: "短视频导演课程-知识体系"

  - id: "finance_investment"
    name: "量化投资"
    description: "量化投资、周期投资、因子策略、金融宏观、黄金、美联储"
    match_keywords: ["量化", "基金", "因子", "ROE", "换手", "超额", "胜率", "算力", "T0", "黄金", "美联储", "华尔街", "道琼斯", "金融", "股价", "回撤"]
    exclude_keywords: ["导演", "短视频", "拍摄"]
    match_files: ["*量化*", "*基金*", "*黄金*"]
    output_name: "量化投资-知识体系"

  - id: "geoeconomics"
    name: "地缘经济"
    description: "地缘经济分析、制裁、贸易战、能源博弈、经济冲突"
    match_keywords: ["地缘", "制裁", "贸易战", "关税", "能源", "石油", "冲突", "战争", "脱钩", "供应链", "稀土", "芯片战", "科技战"]
    exclude_keywords: ["翟东升", "政经启翟", "启翟", "特朗普", "中美", "博弈", "导演", "短视频", "拍摄", "剪辑"]
    match_files: ["*地缘*", "*制裁*", "*贸易战*", "*冲突*"]
    output_name: "地缘经济-知识体系"

  - id: "intl_analysis"
    name: "国际分析"
    description: "国际格局、大国关系、全球秩序、外交战略、发展论坛"
    match_keywords: ["国际", "美国", "欧洲", "全球化", "格局", "秩序", "霸权", "外交", "联盟", "G7", "BRICS", "联合国", "北约", "中东", "印度", "莫迪", "霸主", "帝国", "大国关系", "发展论坛", "俄罗斯", "也门"]
    match_files: ["*国际*", "*美国*", "*格局*", "*印度*"]
    output_name: "国际分析-知识体系"

  - id: "china_politics"
    name: "中国政经"
    description: "中国政治经济、政策分析、体制改革、共同富裕、人口、制造业、宏观需求"
    match_keywords: ["中国", "房产", "内需", "消费", "产业升级", "改革", "政策", "央行", "GDP", "通胀", "利率", "货币", "人民币", "财政", "共同富裕", "人口", "年轻人", "制造业", "税", "养老", "生育", "人才", "东北", "产业", "碳中和", "地方政府", "抢人", "人工智能", "工业", "需求不足", "经济安全", "外汇储备", "这么干"]
    match_files: ["*中国*", "*房产*", "*经济*", "*共同富裕*"]
    output_name: "中国政经-知识体系"

  - id: "geopolitics"
    name: "地缘政治"
    description: "中美博弈、翟东升系列、政经启翟"
    match_keywords: ["中美", "博弈", "翟东升", "缠斗", "货币", "美元", "美债", "政经启翟", "特朗普", "美帝国", "启翟"]
    exclude_keywords: ["制裁", "贸易战", "关税", "供应链", "芯片战"]
    match_files: ["*翟东升*", "*正在发生*", "*中美*", "*政经启翟*"]
    output_name: "地缘政治-知识体系"

  - id: "general"
    name: "其他"
    description: "未归类内容"
    match_keywords: []
    match_files: ["*"]
    output_name: "其他笔记-知识体系"

# 飞书知识库同步配置
feishu:
  enabled: true                     # 总开关（默认关闭，不影响现有流程）
  auto_sync: false                  # 笔记生成后自动同步
  space_id: "7650684490813017052"   # 知识库 space_id（替换为你自己的）
  root_node_token: "GnAZwwhNtiV5AmkFl8XcWUeKncd"  # 根节点（替换为你自己的）

  # 排除的文件模式（不同步到飞书）
  exclude_patterns:
    - "Rick Astley*"                # YouTube 测试
    - "bilibili*"                   # B站测试
    - "*test*"
    - "*测试*"
    - "*_v2.md"                     # 中间版本（只同步 _v5 最终版）
    - "*_v3.md"
    - "*_v4.md"
    - "*_incremental.md"            # 增量更新中间产物
    - "短视频导演课程-知识体系.md"      # 旧版合成（同步 _2stage 版）
    - "短视频导演课程-知识体系_v5.md"   # v5 单次版（同步 _2stage 版）
    - "extractions*"                # 提取缓存
    - "*quality_report*"            # 质量报告（非笔记内容）
    - "*_contradictions*"           # 矛盾检测报告（合成内部文档）

  # ================================================================
  # 飞书知识库分类准则（稳定结构，勿随意修改）
  # ================================================================
  #
  # 层级结构（固定）：
  #   AI笔记库 (root_node_token，不变)
  #     ├── {二级分类A}     ← 按 match 关键词自动归类
  #     │     ├── 跨集提炼  ← 知识体系/框架/模型，随新笔记迭代丰富
  #     │     └── 逐集笔记  ← 每篇独立笔记，持续增长
  #     ├── {二级分类B}
  #     │     ├── 跨集提炼
  #     │     └── 逐集笔记
  #     └── 其他笔记        ← 暂存池，无子结构，平铺
  #
  # 分类规则：
  #   1. 根节点「AI笔记库」固定不变，永远不重建
  #   2. 二级分类按 match 关键词自动匹配文件名，第一个命中生效
  #   3. 普通二级分类内部固定有「跨集提炼」（在上）和「逐集笔记」（在下）
  #   4. 「其他笔记」是暂存池，无子结构；同类笔记积累到一定量后独立出新二级分类
  #   5. 新增主题只需加一条 match 规则，不影响已有结构
  #
  # 排序原则：
  #   - 二级分类之间：按配置顺序排列
  #   - 分类内部：跨集提炼在上（高层知识），逐集笔记在下（原始素材）
  #   - 其他笔记始终排在最后
  #
  # ================================================================
  categories:
    - name: "短视频导演课程"
      match: ["*第*集*", "*导演*", "*短视频*", "*拍摄*", "*剪辑*", "*ep0*", "*ep1*", "*ep2*"]
    - name: "量化投资"
      match: ["*投资*", "*量化*", "*基金*", "*策略*", "*因子*", "*概率*", "*胜率*", "*超额*", "*算力*", "*黄金*", "*美联储*", "*华尔街*", "*金融*", "*汇率*"]
    - name: "地缘经济"
      match: ["*地缘经济*", "*制裁*", "*贸易战*", "*关税*", "*能源*", "*冲突*", "*战争*", "*脱钩*", "*供应链*"]
    - name: "国际分析"
      match: ["*国际*", "*美国*", "*欧洲*", "*全球化*", "*格局*", "*霸权*", "*外交*", "*联盟*", "*中东*", "*北约*", "*印度*", "*莫迪*", "*霸主*", "*帝国*"]
    - name: "中国政经"
      match: ["*中国*", "*房产*", "*内需*", "*消费*", "*改革*", "*政策*", "*央行*", "*GDP*", "*通胀*", "*利率*", "*人民币*", "*共同富裕*", "*人口*", "*年轻人*", "*制造业*", "*碳中和*", "*人才*", "*东北*"]
    - name: "地缘政治"
      match: ["*地缘政治*", "*翟东升*", "*正在发生*", "*中美*", "*博弈*", "*政经启翟*", "*特朗普*", "*美帝国*"]
    - name: "其他笔记"
      match: ["*"]

  # API 参数
  api_interval: 0.5                 # 请求间隔（秒）
  block_batch_size: 50              # 每批写入 block 上限
