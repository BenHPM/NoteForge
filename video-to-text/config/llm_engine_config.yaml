# ============================================================
# NoteForge LLM 笔记引擎配置 v1.0
# 用途: 控制 LLM 提供商、质量阈值、重试策略、输入输出路径
# 最后更新: 2026-06-12
# ============================================================

meta:
  version: "1.0"
  description: "LLM笔记生成引擎配置"

# LLM 提供商配置
# type 可选: claude | openai | local
provider:
  type: "claude"

  claude:
    model: "claude-sonnet-4-20250514"
    api_key_env: "ANTHROPIC_API_KEY"  # 直连时从环境变量读取
    api_key: "PROXY_MANAGED"          # cc-switch 代理模式：代理自动注入 Key
    base_url: "http://127.0.0.1:15721"  # cc-switch 代理（直连改为 https://api.anthropic.com）
    max_tokens: 8192
    temperature: 0.3  # 低温度以提高忠实度
    # ---- cc-switch 代理场景（可选，声明式配置）----
    # 无 Anthropic API，仅经 cc-switch 把请求映射到第三方模型时：
    # served_model: 声明代理实际路由到的模型。生效效果：
    #   - 首次调用即按该模型定价（无需等响应检测）
    #   - 不触发"请求被路由到其它模型"的误导性警告
    #   - 缓存"未生效"日志降为 debug（对第三方模型这是预期，不打扰）
    # 切换模型时只需改这里 + model_pricing 节，无需改代码。
    served_model: "deepseek-v4-flash"
    # context_limit: 可选，覆盖默认 200K（第三方模型上下文可能不同）
    # context_limit: 64000

  openai:
    model: "gpt-4o"
    api_key_env: "OPENAI_API_KEY"
    base_url: "https://api.openai.com/v1"
    max_tokens: 8192
    temperature: 0.3

  local:
    model: "qwen2.5-72b"
    base_url: "http://localhost:11434/v1"  # Ollama 兼容接口
    max_tokens: 8192
    temperature: 0.3
    api_key: "not-needed"

# 模型定价覆盖（可选，$ / 百万 tokens）
# 用于给内置定价表未收录的模型声明价格，切换模型时无需改代码。
# 键 = served_model / 请求 model 名；值与内置表同构：{input, output, cached_input}
# 内置表已含：claude-sonnet-4 / opus-4 / haiku-4 / gpt-4o / deepseek 族 / step-3.7-flash。
# 例：换到新模型 "qwen3-max" 时在此追加即可，代码自动按配置计价。
model_pricing:
  # "qwen3-max": {"input": 0.60, "output": 1.20, "cached_input": 0.06}
  # "glm-4-plus": {"input": 0.80, "output": 2.00, "cached_input": 0.08}

# 内容策略（文档性质：供运维/审计参考，代码不直接读取）
# 所有处理的内容均来自公开平台，已公开发表
content_policy:
  source: "all content from public platforms (Bilibili, YouTube, podcasts)"
  nature: "publicly available, already published content"
  sensitivity: "none - all content is publicly accessible via standard URLs"
  processing_purpose: "academic study notes, knowledge extraction"
  note: >
    所有视频/播客/音频均来自公开平台的公开分享链接，内容本身无敏感性。
    代理模型不应对此类内容触发安全过滤。
    如遇过滤误判，应自动重试而非直接失败。

# 代理架构说明（文档性质：供切换模型时参考，代码不直接读取）
proxy_architecture:
  tool: "cc-switch"
  role: "纯代理/路由层，不做过滤，无 safety_level 配置"
  db: "~/.cc-switch/cc-switch.db"
  config: "~/.cc-switch/settings.json"
  proxy_address: "127.0.0.1:15721"
  upstream: "mimo API (token-plan-sgp.xiaomimimo.com)"
  safety_filter_location: >
    安全过滤发生在 mimo API 服务端，cc-switch 无法控制。
    如果 mimo 模型频繁误判公开内容为敏感内容，解决方案：
    1. 在 cc-switch 中切换到其他 provider（如 deepseek）
    2. 联系 mimo API 提供方调整安全策略
    3. 代码层面：自适应过滤器会自动降低误判敏感度
  note: >
    cc-switch 无 safety_level/content_filter 配置。
    切换到其他代理工具时，需确认新工具有无类似限制。

# 生成质量控制
quality:
  min_score: 0.80            # 最低通过分数
  max_retries: 2             # 最大重试次数（总尝试 = 1 + max_retries）
  retry_temperature_delta: 0.1  # 每次重试温度增加
  fatal_rules_must_pass: true   # R1/R2/R3 必须全部通过

# LLM 评审配置（条件触发，默认关闭）
# 启用后：边界分数(0.75-0.85)的笔记自动调用 LLM 做多维度评审
# 验证结果(2026-07-15, 20文档×3次): 所有维度CV<15%, 零翻转, 成本$0.046/文档
llm_eval:
  enabled: false                    # 总开关（需显式开启）
  on_borderline: true               # 边界分数时触发（需 enabled=true）
  borderline_low: 0.75              # 边界下限
  borderline_high: 0.85             # 边界上限
  max_tokens: 500                   # 评审输出 token 上限
  temperature: 0.1                  # 评审温度（低=稳定）
  source_preview_chars: 3000        # 源文本截取长度
  # 维度阈值（1-5 分，低于阈值生成反馈）
  dimension_thresholds:
    richness: 3.0
    readability: 3.0
    faithfulness: 2.5               # 偏低：同模型自评均值2.36，2.5已是灰度区
    actionability: 3.0
  # faithfulness 特殊处理（同模型自评循环风险）
  faithfulness_mode: "advisory"     # advisory=仅记录不决策 | gate=参与pass/fail
  # 成本控制
  cost_cap_per_batch: 5.0           # 单批次成本上限（美元）
  # 反馈策略
  feedback_mode: "single_dimension"  # single=只反馈最差维度 | multi=反馈所有不达标维度

# 转写文本处理
transcript:
  max_tokens_per_call: 50000    # 单次调用最大 token
  chunk_overlap_tokens: 500     # 分块重叠
  min_chunk_size_tokens: 5000   # 最小分块大小
  clean_unrecognized: true      # 清除 [无法识别片段] 标记
  clean_timestamps: true        # 清除 [HH:MM:SS] 时间戳前缀
  clean_fillers: true           # 清除口语填充词（嗯、啊、那个）

# 输入输出路径（相对于 video-to-text/）
paths:
  rules: "config/note_generation_rules.yaml"
  experience: "config/experience_log.yaml"
  transcripts_dir: "output/transcripts"
  notes_dir: "output/notes"
  reports_dir: "output/quality_reports"
  format_example: "output/notes/第01集-偷是所有大师的第一步_v5.md"
  # 清洗规则和格式模板（留空则使用内置默认值）
  cleaning_rules: "config/cleaning_rules.yaml"
  format_templates: "config/format_templates.yaml"

# 日志
logging:
  level: "INFO"  # DEBUG | INFO | WARNING | ERROR
  save_intermediate: true   # 保存每次 LLM 调用的原始输出
  log_dir: "output/logs"

# API 调用重试（网络层，区别于质量重试）
api_retry:
  max_attempts: 3
  base_delay: 10              # 初始退避秒数
  max_delay: 120              # 最大退避秒数

# ================================================================
# 知识域分类配置
domain_classification:
  use_tfidf_fallback: true        # 启用 TF-IDF 余弦相似度兜底
  fallback_threshold: 0.15        # 关键词分数低于此值时触发兜底
  tie_threshold: 0.01             # 平局判定：前两名分数差小于此值时触发兜底

# 知识域配置（用于笔记分类 + 跨集合成的域隔离）
# ================================================================
# 分类策略（两级匹配，防误判）：
#
# 第一级：文件名匹配（match_files，快速精确）
#   - 通配符模式，优先级高于关键词
#   - 适用于有明确命名规则的内容（如 "第X集"、"*翟东升*"）
#
# 第二级：内容关键词匹配（match_keywords，容错兜底）
#   - 扫描笔记前 5000 字，统计各域命中关键词数
#   - 命中数最多的域胜出（score-based，非 first-match）
#   - 支持 exclude_keywords：命中排除词的域直接跳过
#   - 未命中任何域 → 归入 general（兜底）
#
# 分类优化指南：
#   1. 泛化词（如"策略"、"投资"）容易跨域误匹配
#      → 改用更具体的词（如"量化策略"、"基金收益"）或加 exclude_keywords
#   2. 新增域时，先分析目标内容的高频词，再配 match_keywords
#   3. exclude_keywords 用于排除"同形异义"（如"投资"在金融 vs 视频制作设备）
#   4. general 域必须放最后，且 match_keywords 为空
#   5. 分类结果可在 output/logs/pipeline_progress.json 中按 category 字段追溯
#
# 知识合成配置
# ================================================================
synthesis:
  auto_trigger: true           # 笔记生成后自动触发同域跨集合成
  auto_trigger_min_notes: 3    # 同域笔记达到此数量时触发合成

# 知识域配置
# ================================================================
# 飞书分类与知识域的对应关系：
#   - 飞书 categories（下方 feishu 段）控制文档归入哪个飞书文件夹
#   - knowledge_domains 控制跨集合成时的域隔离
#   - 两者的关键词应保持一致，避免分类和合成不匹配
# ================================================================
knowledge_domains:
  - id: "short_video_directing"
    name: "短视频导演课程"
    description: "短视频创作方法论、导演技巧、拍摄剪辑"
    match_keywords: ["导演", "短视频", "拍摄", "剪辑", "剧本", "创作流程", "爆火", "IP", "镜头", "运镜", "文案", "封面"]
    exclude_keywords: ["量化", "投资", "基金", "地缘", "中美"]
    match_files: ["第*集*", "ep0*", "ep1*"]
    output_name: "短视频导演课程-知识体系"

  # 2026-08-03 重排：地缘政治提到 finance_investment 之前（match_files 按配置顺序 first-match）。
  # 原因：原顺序下 finance 的 *汇率*/*黄金*/*金融* 会把翟东升/政经启翟笔记截胡进量化域，
  # 导致 量化投资-知识体系 混入地缘/宏观内容；而 翟东升/政经启翟/中美 本就是地缘政治的
  # 声明标识，应优先归地缘政治域（同时也修复政经启翟系列被误归入中国政经/国际分析的问题）。
  - id: "geopolitics"
    name: "地缘政治"
    description: "中美博弈、翟东升系列、政经启翟"
    match_keywords: ["中美", "博弈", "翟东升", "缠斗", "货币", "美元", "美债", "政经启翟", "特朗普", "美帝国", "启翟", "地缘"]
    exclude_keywords: ["制裁", "贸易战", "关税", "供应链", "芯片战"]
    match_files: ["*翟东升*", "*正在发生*", "*中美*", "*政经启翟*"]
    output_name: "地缘政治-知识体系"

  - id: "finance_investment"
    name: "量化投资"
    description: "量化投资、周期投资、因子策略、金融宏观、黄金、美联储"
    match_keywords: ["量化", "基金", "因子", "ROE", "换手", "超额", "胜率", "算力", "T0", "黄金", "美联储", "华尔街", "道琼斯", "金融", "股价", "回撤"]
    exclude_keywords: ["导演", "短视频", "拍摄"]
    # 2026-08-03 修复：移除过宽的 *经济*（会把翟东升地缘/宏观笔记拉进量化合成，导致跨域混合），
    # 替换为更精确的 *达利欧*/*汇率*/*金融*（文件名的强量化/金融标识）
    match_files: ["*量化*", "*基金*", "*黄金*", "*达利欧*", "*汇率*", "*金融*"]
    output_name: "量化投资-知识体系"

  - id: "geoeconomics"
    name: "地缘经济"
    description: "地缘经济分析、制裁、贸易战、能源博弈、经济冲突"
    match_keywords: ["地缘", "制裁", "贸易战", "关税", "能源", "石油", "冲突", "战争", "脱钩", "供应链", "稀土", "芯片战", "科技战"]
    exclude_keywords: ["翟东升", "政经启翟", "启翟", "特朗普", "中美", "博弈", "导演", "短视频", "拍摄", "剪辑"]
    match_files: ["*地缘*", "*制裁*", "*贸易战*", "*冲突*"]
    output_name: "地缘经济-知识体系"

  - id: "intl_analysis"
    name: "国际分析"
    description: "国际格局、大国关系、全球秩序、外交战略、发展论坛"
    match_keywords: ["国际", "美国", "欧洲", "全球化", "格局", "秩序", "霸权", "外交", "联盟", "G7", "BRICS", "联合国", "北约", "中东", "印度", "莫迪", "霸主", "帝国", "大国关系", "发展论坛", "俄罗斯", "也门"]
    match_files: ["*国际*", "*美国*", "*格局*", "*印度*"]
    output_name: "国际分析-知识体系"

  - id: "china_politics"
    name: "中国政经"
    description: "中国政治经济、政策分析、体制改革、共同富裕、人口、制造业、宏观需求"
    match_keywords: ["中国", "房产", "内需", "消费", "产业升级", "改革", "政策", "央行", "GDP", "通胀", "利率", "货币", "人民币", "财政", "共同富裕", "人口", "年轻人", "制造业", "税", "养老", "生育", "人才", "东北", "产业", "碳中和", "地方政府", "抢人", "人工智能", "工业", "需求不足", "经济安全", "外汇储备", "这么干"]
    match_files: ["*中国*", "*房产*", "*共同富裕*"]
    output_name: "中国政经-知识体系"

  - id: "ai_tech"
    name: "AI与大模型"
    description: "AI大模型、创业访谈、技术趋势、智能体、开源社区"
    match_keywords: ["大模型", "智能体", "Agent", "LLM", "ChatGPT", "OpenAI", "Anthropic", "Gemini", "Claude", "智谱", "Kimi", "vLLM", "Post-train", "OpenClaw", "模型", "访谈", "Agentic"]
    exclude_keywords: ["翟东升", "政经启翟", "启翟", "导演", "短视频", "量化", "基金", "地缘", "中美"]
    match_files: ["*大模型*", "*Agent*", "*智能体*", "*LLM*", "*Anthropic*", "*Gemini*", "*智谱*", "*Kimi*", "*vLLM*", "*OpenClaw*", "*Post-train*"]
    output_name: "AI与大模型-知识体系"

  - id: "general"
    name: "其他"
    description: "未归类内容（detect_domain 的兜底返回值，无需 match_files）"
    match_keywords: []
    match_files: []                  # 留空，general 是代码中的兜底逻辑
    output_name: "其他笔记-知识体系"

# 飞书知识库同步配置
feishu:
  enabled: true                     # 总开关（默认关闭，不影响现有流程）
  auto_sync: false                  # 笔记生成后自动同步
  # space_id 和 root_node_token 从环境变量读取，避免凭证泄露
  space_id: "7650684490813017052"  # AI笔记库（固定不变）
  root_node_token: "GnAZwwhNtiV5AmkFl8XcWUeKncd"  # AI笔记库根节点（固定不变）

  # 排除的文件模式（不同步到飞书）
  exclude_patterns:
    - "Rick Astley*"                # YouTube 测试
    - "bilibili*"                   # B站测试
    - "*test*"
    - "*测试*"
    - "*_v2.md"                     # 中间版本（只同步 _v5 最终版）
    - "*_v3.md"
    - "*_v4.md"
    - "*_incremental.md"            # 增量更新中间产物
    - "短视频导演课程-知识体系.md"      # 旧版合成（同步 _2stage 版）
    - "短视频导演课程-知识体系_v5.md"   # v5 单次版（同步 _2stage 版）
    - "extractions*"                # 提取缓存
    - "*quality_report*"            # 质量报告（非笔记内容）
    - "*_contradictions*"           # 矛盾检测报告（合成内部文档）

  # 低价值笔记过滤（2026-08-03 新增）：本地保留，但不同步到飞书
  # 招生简章/上线通知/公告预告等无知识含量内容。命中任一模式即跳过同步。
  # 内容级拦截由代码内置标记完成（见 core/note_value.py），此处只管文件名模式，可自由增删。
  junk_patterns:
    - "*简章*"
    - "*招生*"
    - "*上线啦*"
    - "*上线通知*"
    - "*公告*"
    - "*预告*"
    - "*报名*"
    - "*宣传片*"

  # ================================================================
  # 飞书知识库分类准则（稳定结构，勿随意修改）
  # ================================================================
  #
  # 层级结构（固定）：
  #   AI笔记库 (root_node_token，不变)
  #     ├── {二级分类A}     ← 按 match 关键词自动归类
  #     │     ├── 跨集提炼  ← 知识体系/框架/模型，随新笔记迭代丰富
  #     │     └── 逐集笔记  ← 每篇独立笔记，持续增长
  #     ├── {二级分类B}
  #     │     ├── 跨集提炼
  #     │     └── 逐集笔记
  #     └── 其他笔记        ← 暂存池，无子结构，平铺
  #
  # 分类规则：
  #   1. 根节点「AI笔记库」固定不变，永远不重建
  #   2. 二级分类按 match 关键词自动匹配文件名，第一个命中生效
  #   3. 普通二级分类内部固定有「跨集提炼」（在上）和「逐集笔记」（在下）
  #   4. 「其他笔记」是暂存池，无子结构；同类笔记积累到一定量后独立出新二级分类
  #   5. 新增主题只需加一条 match 规则，不影响已有结构
  #
  # 排序原则：
  #   - 二级分类之间：按配置顺序排列
  #   - 分类内部：跨集提炼在上（高层知识），逐集笔记在下（原始素材）
  #   - 其他笔记始终排在最后
  #
  # ================================================================
  # 分类匹配规则（v3 - 修复短视频剧集漏归类 + 消除死映射）
  #
  # 核心原则：文件名匹配必须"稳定优先"--能在多次同步周期中
  # 对同一内容给出一致结果，否则 hash 缓存失效、飞书侧产生重复。
  #
  # 稳定性来源（按可靠度排序）：
  #   1. 内容来源的固定命名约定（如短视频导演课程的"第*集*"前缀）
  #   2. 命名空间隔离的强标识（如"翟东升/政经启翟"只出现在地缘政治）
  #   3. 文件名动词（导演/拍摄/剪辑）
  #   4. 通用名词（经济/美国/中国）--最不稳定，放最后
  #
  # 顺序依据：
  #   - 短视频导演课程放第一：文件名有稳定的"第*集*"前缀约定，
  #     且 ep*/第*集 不含地缘政治关键词，不会被地缘政治截胡
  #   - 地缘政治放第二：翟东升/政经启翟是地缘政治的强独占标识
  #   - 通用词分类（中国/国际）放后面
  #
  # exclude 设计要点（v3 修正）：
  #   exclude 模式必须针对本分类 match 集合"可能误命中"的文件，
  #   而非列出其他分类的关键词。例如地缘政治 match 里没有"导演"，
  #   所以 exclude "*导演*" 是无效防御--已在 v3 移除这类空挡。
  #
  # ================================================================
  categories:
    - name: "短视频导演课程"
      # 短视频剧集文件名稳定前缀"第*集*"作为兜底，避免 63% 剧集漏归类
      match: ["*第*集*", "*导演*", "*短视频*", "*拍摄*", "*剪辑*", "*短视频导演课程-知识体系*"]
      exclude: ["*翟东升*", "*政经启翟*", "*启翟一下*", "*地缘*", "*量化*", "*基金*", "*黄金*"]
    - name: "地缘政治"
      match: ["*地缘政治*", "*翟东升*", "*正在发生*", "*政经启翟*", "*启翟一下*", "*中美*", "*博弈*", "*特朗普*", "*美帝国*"]
      exclude: ["*第*集*", "*导演*", "*短视频*", "*拍摄*", "*剪辑*"]
    - name: "地缘经济"
      match: ["*地缘经济*", "*制裁*", "*贸易战*", "*关税*", "*能源*", "*脱钩*", "*供应链*"]
      exclude: ["*翟东升*", "*政经启翟*", "*第*集*"]
    - name: "量化投资"
      match: ["*量化*", "*基金*", "*因子*", "*ROE*", "*超额*", "*T0*", "*算力*", "*华尔街*", "*胜率*", "*黄金*", "*达利欧*", "*汇率*"]
      exclude: ["*翟东升*", "*政经启翟*", "*地缘*", "*第*集*"]
    - name: "国际分析"
      match: ["*国际*", "*欧洲*", "*霸权*", "*外交*", "*联盟*", "*中东*", "*北约*", "*莫迪*", "*霸主*", "*美国*", "*大国*", "*全球化*", "*发展论坛*", "*俄罗斯*"]
      exclude: ["*翟东升*", "*政经启翟*", "*地缘*", "*中国*", "*第*集*"]
    - name: "中国政经"
      match: ["*中国*", "*房产*", "*内需*", "*消费*", "*改革*", "*央行*", "*GDP*", "*通胀*", "*利率*", "*人民币*", "*共同富裕*", "*制造业*", "*碳中和*"]
      exclude: ["*翟东升*", "*政经启翟*", "*地缘*", "*中美*", "*博弈*", "*第*集*"]
    - name: "AI与大模型"
      # AI大模型/创业访谈/智能体：匹配模型名、Agent、访谈等强标识
      match: ["*大模型*", "*Agent*", "*智能体*", "*LLM*", "*Anthropic*", "*Gemini*", "*智谱*", "*Kimi*", "*vLLM*", "*OpenClaw*", "*Post-train*", "*访谈*", "*人工智能*"]
      exclude: ["*翟东升*", "*政经启翟*", "*启翟*", "*量化*", "*基金*", "*投资*", "*地缘*", "*第*集*"]
    - name: "其他笔记"
      match: ["*"]

  # API 参数
  api_interval: 0.5                 # 请求间隔（秒）
  block_batch_size: 50              # 每批写入 block 上限
  # 暂存池自动分类（确定性逻辑，不依赖 LLM，任何模型下结果一致）
  # 当「其他笔记」暂存池中同域笔记达到阈值时，自动提升为独立分类并持久化
  auto_promote:
    enabled: true          # 总开关
    threshold: 5           # 同域笔记数达到此值时自动独立成类

