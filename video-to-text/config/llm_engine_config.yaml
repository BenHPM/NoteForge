# ============================================================
# NoteForge LLM 笔记引擎配置 v1.0
# 用途: 控制 LLM 提供商、质量阈值、重试策略、输入输出路径
# 最后更新: 2026-06-12
# ============================================================

meta:
  version: "1.0"
  description: "LLM笔记生成引擎配置"

# LLM 提供商配置
# type 可选: claude | openai | local
provider:
  type: "claude"

  claude:
    model: "claude-sonnet-4-20250514"
    api_key_env: "ANTHROPIC_API_KEY"  # 直连时从环境变量读取
    api_key: "PROXY_MANAGED"          # cc-switch 代理模式：代理自动注入 Key
    base_url: "http://127.0.0.1:15721"  # cc-switch 代理（直连改为 https://api.anthropic.com）
    max_tokens: 8192
    temperature: 0.3  # 低温度以提高忠实度

  openai:
    model: "gpt-4o"
    api_key_env: "OPENAI_API_KEY"
    base_url: "https://api.openai.com/v1"
    max_tokens: 8192
    temperature: 0.3

  local:
    model: "qwen2.5-72b"
    base_url: "http://localhost:11434/v1"  # Ollama 兼容接口
    max_tokens: 8192
    temperature: 0.3
    api_key: "not-needed"

# 生成质量控制
quality:
  min_score: 0.80            # 最低通过分数
  max_retries: 2             # 最大重试次数（总尝试 = 1 + max_retries）
  retry_temperature_delta: 0.1  # 每次重试温度增加
  fatal_rules_must_pass: true   # R1/R2/R3 必须全部通过

# 转写文本处理
transcript:
  max_tokens_per_call: 50000    # 单次调用最大 token
  chunk_overlap_tokens: 500     # 分块重叠
  min_chunk_size_tokens: 5000   # 最小分块大小
  clean_unrecognized: true      # 清除 [无法识别片段] 标记
  clean_timestamps: true        # 清除 [HH:MM:SS] 时间戳前缀
  clean_fillers: true           # 清除口语填充词（嗯、啊、那个）

# 输入输出路径（相对于 video-to-text/）
paths:
  rules: "config/note_generation_rules.yaml"
  experience: "config/experience_log.yaml"
  transcripts_dir: "output/transcripts"
  notes_dir: "output/notes"
  reports_dir: "output/quality_reports"
  format_example: "output/notes/第01集-偷是所有大师的第一步.md"

# 日志
logging:
  level: "INFO"  # DEBUG | INFO | WARNING | ERROR
  save_intermediate: true   # 保存每次 LLM 调用的原始输出
  log_dir: "output/logs"

# API 调用重试（网络层，区别于质量重试）
api_retry:
  max_attempts: 3
  base_delay: 10              # 初始退避秒数
  max_delay: 120              # 最大退避秒数

# 知识域配置（用于跨集合成的域隔离）
# 同一域内的笔记才会被合成为一份知识体系文档
# 不同域的笔记各自独立合成，互不干扰
knowledge_domains:
  - id: "short_video_directing"
    name: "短视频导演课程"
    description: "短视频创作方法论、导演技巧、拍摄剪辑"
    match_keywords: ["导演", "短视频", "拍摄", "剪辑", "剧本", "创作流程", "爆火", "IP"]
    match_files: ["第*集*", "ep0*", "ep1*"]
    output_name: "短视频导演课程-知识体系"

  - id: "geopolitics"
    name: "国际政治与经济"
    description: "地缘政治分析、大国博弈、货币体系、宏观经济"
    match_keywords: ["中美", "地缘", "博弈", "货币", "美元", "霸权", "全球化", "缠斗", "翟东升"]
    match_files: ["*翟东升*", "*正在发生*", "*中美*"]
    output_name: "国际政治与经济-知识体系"

  - id: "finance_investment"
    name: "金融投资"
    description: "量化投资、周期投资、资产管理"
    match_keywords: ["投资", "量化", "策略", "T0", "周期", "因子", "ROE"]
    match_files: ["*投资*", "*量化*", "*策略*"]
    output_name: "金融投资-知识体系"

  - id: "general"
    name: "其他"
    description: "未归类内容"
    match_keywords: []
    match_files: ["*"]
    output_name: "其他笔记-知识体系"

# 飞书知识库同步配置
feishu:
  enabled: true                     # 总开关（默认关闭，不影响现有流程）
  auto_sync: false                  # 笔记生成后自动同步
  space_id: "7650684490813017052"   # 知识库 space_id（替换为你自己的）
  root_node_token: "GnAZwwhNtiV5AmkFl8XcWUeKncd"  # 根节点（替换为你自己的）

  # 排除的文件模式（不同步到飞书）
  exclude_patterns:
    - "Rick Astley*"                # YouTube 测试
    - "bilibili*"                   # B站测试
    - "*test*"
    - "*测试*"
    - "*_v2.md"                     # 中间版本（只同步 _v5 最终版）
    - "*_v3.md"
    - "*_v4.md"
    - "*_incremental.md"            # 增量更新中间产物
    - "短视频导演课程-知识体系.md"      # 旧版合成（同步 _2stage 版）
    - "短视频导演课程-知识体系_v5.md"   # v5 单次版（同步 _2stage 版）
    - "extractions*"                # 提取缓存
    - "*quality_report*"            # 质量报告（非笔记内容）

  # ================================================================
  # 飞书知识库分类准则（稳定结构，勿随意修改）
  # ================================================================
  #
  # 层级结构（固定）：
  #   AI笔记库 (root_node_token，不变)
  #     ├── {二级分类A}     ← 按 match 关键词自动归类
  #     │     ├── 跨集提炼  ← 知识体系/框架/模型，随新笔记迭代丰富
  #     │     └── 逐集笔记  ← 每篇独立笔记，持续增长
  #     ├── {二级分类B}
  #     │     ├── 跨集提炼
  #     │     └── 逐集笔记
  #     └── 其他笔记        ← 暂存池，无子结构，平铺
  #
  # 分类规则：
  #   1. 根节点「AI笔记库」固定不变，永远不重建
  #   2. 二级分类按 match 关键词自动匹配文件名，第一个命中生效
  #   3. 普通二级分类内部固定有「跨集提炼」（在上）和「逐集笔记」（在下）
  #   4. 「其他笔记」是暂存池，无子结构；同类笔记积累到一定量后独立出新二级分类
  #   5. 新增主题只需加一条 match 规则，不影响已有结构
  #
  # 排序原则：
  #   - 二级分类之间：按配置顺序排列
  #   - 分类内部：跨集提炼在上（高层知识），逐集笔记在下（原始素材）
  #   - 其他笔记始终排在最后
  #
  # ================================================================
  categories:
    - name: "短视频导演课程"
      match: ["*第*集*", "*导演*", "*短视频*", "*拍摄*", "*剪辑*"]
    - name: "金融投资"
      match: ["*量化*", "*投资*", "*基金*", "*策略*", "*因子*", "*概率*", "*胜率*", "*超额*"]
    - name: "地缘政治"
      match: ["*翟东升*", "*正在发生*", "*中美*", "*地缘*"]
    - name: "其他笔记"
      match: ["*"]

  # API 参数
  api_interval: 0.5                 # 请求间隔（秒）
  block_batch_size: 50              # 每批写入 block 上限
