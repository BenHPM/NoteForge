entries:

  - id: "EXP-001"
    date: "2026-05-08"
    source_note: "STUDY_NOTES.md 视频2章节 - 周期投资者的焦虑来源"
    error_type: "虚构数据"
    severity: "fatal"
    original_text_quote: >
      子阳老师原文被问及焦虑来源时，分别提到了选股失误、业绩压力、
      考核责任等多个方面，但从未给出任何百分比量化。
    generated_note_quote: >
      "焦虑来源(按权重): 业绩压力40%、选股失误25%、风格漂移20%、客户赎回15%"
    root_cause: >
      AI有强烈的"量化一切"倾向，遇到定性描述时会自动赋予精确数字
      以满足结构化输出的需求。这在金融笔记中是致命的。
    derived_rule: "R1_禁止虚构数据"
    lesson: >
      【教训】AI的"帮助欲"体现在：遇到模糊描述时，
      不是诚实地保留模糊，而是自作主张精确化。
      【对策】生成后扫描所有数字，逐一核实原文出处。

  - id: "EXP-002"
    date: "2026-05-08"
    source_note: "STUDY_NOTES.md 视频2章节 - 应对策略建议"
    error_type: "越界增补"
    severity: "fatal"
    original_text_quote: >
      原文中子阳老师被问及"如何应对"时，回答是"选择未来的投资方向、
      调整资产配置、控制仓位"，但没有给出任何结构化的策略建议清单。
    generated_note_quote: >
      "✅短期应对: 严格控制仓位、关注需求端实时数据、准备好止损预案
       📈中期布局: 寻找供给刚性子行业、重点关注现金流健康企业、逆向布局超跌优质标的"
    root_cause: >
      AI有"回答未尽之问"的倾向——当原文的回答不够结构化时，
      AI会自行补充一个"更完整"的答案，但这实际上是在替嘉宾发言。
    derived_rule: "R2_禁止越界增补"
    lesson: >
      【教训】AI的"完整性偏好"会驱使它填补原文中的"空白"，
      但笔记的目标是忠实记录，而非补全。
      【对策】所有非原文内容必须标注"[📝笔者补充]"。

  - id: "EXP-003"
    date: "2026-05-08"
    source_note: "STUDY_NOTES.md 视频1章节 - 关键洞察"
    error_type: "事实反转"
    severity: "fatal"
    original_text_quote: >
      曹健康原文:"目前我们所做的大部分工作都是基于非解释性因子，
      人工可解释的占比相对较小...深度学习和AI技术中的非线性组合
      及复杂逻辑往往难以通过人的主观定义去理解和解析。"
    generated_note_quote: >
      "量化不是黑箱，本质是系统化、纪律化的投资方法，可解释性强于主观交易"
    root_cause: >
      AI在提炼"洞察"时可能为了追求正面积极的结论而翻转原文立场。
      "不可解释的因子占主流"被翻转为"可解释性强"。
    derived_rule: "R3_禁止事实反转"
    lesson: >
      【教训】AI在压缩复杂论述时，可能出现"极性反转"——
      尤其是在涉及强弱对比的描述中。
      【对策】对每个核心论点做"正反校验"：如果原文说是A，
      笔记不能写成非A。

  - id: "EXP-004"
    date: "2026-05-08"
    source_note: "STUDY_NOTES.md 视频1章节 - 量化策略类型解析"
    error_type: "关键概念简化失真"
    severity: "major"
    original_text_quote: >
      曹健康原文:"虽然说叫T0，大家听起来可能是比较偏高频，
      但其实整体上我们的策略还是比较偏中低频的，
      因为我们做的都是一些比较长周期的预测。"
    generated_note_quote: >
      "T+0策略: 日内回转交易 | 适用范围: 活跃账户"
    root_cause: >
      AI的表格简化会丢弃概念的核心限定词。
      "中低频长周期预测"是T0策略的本质定位，但被简化成了
      "日内回转交易"——丢失了最关键的区别信息。
    derived_rule: "R4_禁止关键概念简化失真"
    lesson: >
      【教训】表格/一句话总结是概念失真的高发区。
      当原文对概念有"虽然X但其实是Y"的辩证描述时，
      简化版只保留了X而丢了Y。
      【对策】策略/概念的描述必须同时保留正反两面的限定词。

  - id: "EXP-005"
    date: "2026-05-08"
    source_note: "STUDY_NOTES.md 视频2 - 整体覆盖度"
    error_type: "大面积遗漏"
    severity: "major"
    original_text_quote: >
      听悟章节速览共13个段落，涵盖：碳酸锂案例、铜AI需求、
      铝供给冲击、稀有金属、煤炭天然气联动、白银vs黄金、
      周期vs价值投资对比、子阳右侧卖出风格等。
    generated_note_quote: >
      笔记仅覆盖了约6个议题，遗漏了碳酸锂案例、铜AI需求、
      周期vs价值投资对比、子阳右侧卖出风格等核心内容。
    root_cause: >
      AI在长文本压缩时有"选择性关注"倾向——倾向于保留
      宏观叙事而丢弃具体案例和技术性内容。
    derived_rule: "R5_覆盖度底线"
    lesson: >
      【教训】AI的注意力机制天然偏向文本开头和结尾，
      中间段落的内容容易被忽略。
      【对策】强制要求：生成后对照原文章节列表做覆盖度自检。

  - id: "EXP-006"
    date: "2026-05-08"
    source_note: "STUDY_NOTES.md 视频1 - 术语表与正文矛盾"
    error_type: "术语一致性矛盾"
    severity: "medium"
    original_text_quote: >
      术语表定义:"因子 - 影响股价的量化特征(市值、动量等)"
      正文:"量化不是黑箱...可解释性强于主观交易"
    generated_note_quote: >
      术语表是中性的技术定义，但正文提炼出的"洞察"与术语表中
      隐含的"因子不可解释"方向矛盾。
    root_cause: >
      AI在独立生成术语表和正文时，两部分内容可能不一致，
      因为它们是分开推理的，没有做全局一致性校验。
    derived_rule: "R6_术语一致性"
    lesson: >
      【教训】AI生成表格和生成段落是两条独立的推理路径，
      可能导致自相矛盾。
      【对策】生成后抽取术语表中的关键词，逐一检查正文中的使用。

  - id: "EXP-007"
    date: "2026-06-17"
    source_note: "短视频导演课程 ep01-16 复查"
    error_type: "过度泛化引用原话"
    severity: "medium"
    original_text_quote: >
      讲师在课堂上多次使用"所有大师都是这样"、"每个人都会经历"等口语化表达，
      这是教学风格的一部分，强调普遍性。
    generated_note_quote: >
      笔记将讲师的口语化表述原样保留为"所有人都应该这样做"，
      但没有标注这是讲师的个人观点而非客观事实。
    root_cause: >
      AI无法区分"讲师的夸张教学表达"和"可迁移的通用原则"，
      导致将个人观点包装为普适规律。
    derived_rule: "R9_分层准确性"
    lesson: >
      【教训】讲师/嘉宾的口语化泛化表述（"所有人都""每个XX都"）需要特别处理。
      如果是引用原话，应加引号标注；如果是提炼为原则，应标注适用范围。
      【对策】泛化表述出现时，检查上下文是否有引号/说话人标记，
      区分引用原话 vs 笔记作者的总结。

  - id: "EXP-008"
    date: "2026-06-17"
    source_note: "短视频导演课程 ep01-16 复查"
    error_type: "笔记结构同质化"
    severity: "major"
    original_text_quote: >
      19 集内容涵盖课程讲座、实操演示、花絮创作等多种内容类型。
    generated_note_quote: >
      所有笔记均使用相同的结构模板（核心观点→案例框架→学习总结→行动清单→金句），
      没有根据内容类型调整。
    root_cause: >
      AI prompt 中的格式要求是硬编码的单一模板，无法适配不同内容类型。
      实操类内容应以步骤清单为主体，访谈类应区分主持人和嘉宾。
    derived_rule: "prompt格式弹性化"
    lesson: >
      【教训】不同类型的内容需要不同的笔记结构。
      课程/讲座→观点提炼模板，实操→步骤清单模板，访谈→对话结构模板。
      【对策】在 prompt 中根据内容类型选择对应的格式模板。

  - id: "EXP-009"
    date: "2026-06-20"
    source_note: "B站161视频批量处理 - 分类实践"
    error_type: "分类粒度不足"
    severity: "major"
    original_text_quote: >
      161个视频初始分为4类，其中"其他"类别包含42个视频（占26%），
      大量有价值的政经内容被归入兜底类。
    generated_note_quote: >
      初始分类：量化投资6 + 地缘经济13 + 国际分析40 + 其他42。
      最终分类：量化投资21 + 地缘经济11 + 国际分析46 + 中国政经58 + 地缘政治18 + 其他7。
    root_cause: >
      关键词覆盖不足导致大量内容落入兜底类。同时缺少exclude_keywords机制，
      泛化词（如"策略"）在不同域之间造成误匹配。
    derived_rule: "分类机制迭代"
    lesson: >
      【教训】分类应该是三阶段迭代过程，而非一步到位：
      1. 标题预分类（快但粗糙，用于排序和启动）
      2. 内容深分类（笔记生成后基于内容重新归类）
      3. 人工微调（处理"其他"中的边界案例）
      【对策】
      - 新增exclude_keywords机制，排除同形异义词
      - 关键词应具体化（"量化策略"优于"策略"）
      - 分类结果应在笔记生成后回写更新

  - id: "EXP-010"
    date: "2026-06-20"
    source_note: "B站161视频批量处理 - 代理兼容"
    error_type: "代理模式API Key缺失"
    severity: "fatal"
    original_text_quote: >
      配置了cc-switch代理(127.0.0.1:15721)，但代码要求ANTHROPIC_API_KEY环境变量。
    generated_note_quote: >
      LLMError: 环境变量 ANTHROPIC_API_KEY 未设置。
    root_cause: >
      代理模式下API Key由代理注入，客户端不需要真实Key。
      但代码硬性要求环境变量中有值，未考虑代理自动注入场景。
    derived_rule: "代理兼容"
    lesson: >
      【教训】使用代理（cc-switch等）时，客户端不需要真实的API Key。
      代码应自动检测：如果base_url不是直连地址，允许使用占位符Key。
      【对策】代理模式下自动使用PROXY_MANAGED占位符，不检查环境变量。

  - id: "EXP-011"
    date: "2026-06-20"
    source_note: "B站161视频批量处理 - 内容安全过滤"
    error_type: "安全过滤误判"
    severity: "major"
    original_text_quote: >
      地缘政治类视频（中美博弈、制裁等）的笔记被模型安全策略拦截，
      返回内容被替换为拒绝语句。
    generated_note_quote: >
      内容安全过滤: 模型拒绝生成（可能是敏感话题触发安全策略）
    root_cause: >
      内容安全过滤检测过于激进：返回内容<50字即判定为过滤，
      且retryable=False直接失败不重试。中文关键词（安全过滤/敏感内容）
      在正常地缘政治讨论中也会出现。
    derived_rule: "安全过滤调优"
    lesson: >
      【教训】公网公开内容不应被安全过滤拦截。
      过滤阈值应区分"模型拒绝"和"内容简短"。
      【对策】
      - 阈值降至<20字
      - 只对<200字的短回复检查拒绝模式
      - 移除中文过滤词（正常内容也会出现）
      - 过滤错误改为retryable=True（模型偶尔拒绝但重试可能成功）

  - id: "EXP-012"
    date: "2026-06-20"
    source_note: "B站161视频批量处理 - 质量反馈循环"
    error_type: "重试时变量未初始化"
    severity: "fatal"
    original_text_quote: >
      首次LLM调用失败（如内容安全过滤）后，重试时访问未初始化的_last_note_text。
    generated_note_quote: >
      AttributeError: 'LLMNoteEngine' object has no attribute '_last_note_text'
    root_cause: >
      _last_note_text和_last_quality_report在__init__中未初始化，
      仅在首次LLM调用成功后赋值。首次调用失败时重试会崩溃。
    derived_rule: "变量初始化完整性"
    lesson: >
      【教训】所有在重试逻辑中使用的变量必须在__init__中初始化。
      批量处理是发现边界case的最佳方式——单个视频测试很难触发。
      【对策】
      - __init__中初始化_last_note_text=""和_last_quality_report=None
      - 重试时检查None，用原始prompt替代反馈prompt

  - id: "EXP-013"
    date: "2026-06-21"
    source_note: "飞书同步质量复查 - 版本重复"
    error_type: "本地多版本导致飞书重复"
    severity: "major"
    original_text_quote: >
      短视频导演课程 ep01-ep19 有三种版本：epXX（无标题）、第X集（有标题）、
      第X集_v5（质量优化版），共 57 个文件对应 19 集内容。
    generated_note_quote: >
      飞书同步后短视频导演课程/逐集笔记有 50 篇，实际应为 19 篇。
    root_cause: >
      批量处理时使用 --force 重新生成笔记，旧版本未清理。
      不同批次的处理产生了 epXX、第X集、_v5 三种命名格式。
    derived_rule: "版本管理"
    lesson: >
      【教训】同一内容的多个版本会在飞书同步时产生重复。
      本地应该只保留最新版本，旧版本归档。
      【对策】
      - 批量处理后自动归档旧版本到 _archive/
      - 飞书同步前检查本地是否有同内容多版本
      - 优先保留 _v5（质量优化版），归档 epXX 和非 _v5

  - id: "EXP-014"
    date: "2026-06-21"
    source_note: "飞书同步质量复查 - 分类通配符过宽"
    error_type: "飞书分类匹配过宽导致文档归错类"
    severity: "major"
    original_text_quote: >
      地缘经济的 match 规则用了 *地缘*，导致"地缘政治-知识体系.md"
      被匹配到地缘经济而非地缘政治。
    generated_note_quote: >
      地缘经济/跨集提炼下同时出现地缘政治-知识体系和地缘经济-知识体系。
    root_cause: >
      飞书分类用 fnmatch 通配符匹配文件名，*地缘* 匹配所有含"地缘"的文件。
      但知识域分类用的是加权关键词匹配，两者逻辑不一致。
    derived_rule: "飞书分类与知识域对齐"
    lesson: >
      【教训】飞书 categories 的 match 规则应该和 knowledge_domains 的 match_files 保持一致。
      通配符过宽会导致文档归错类，过窄会导致文档落入「其他笔记」。
      【对策】
      - 飞书分类用更精确的通配符（*地缘经济* 而非 *地缘*）
      - 合成文档的命名应包含域 ID（如"地缘政治-知识体系"而非"国际政治与经济-知识体系"）
      - 定期检查飞书分类是否与本地分类一致

  - id: "EXP-015"
    date: "2026-06-21"
    source_note: "飞书同步质量复查 - 歧义文件名"
    error_type: "文件名含'知识体系'导致误入跨集提炼"
    severity: "medium"
    original_text_quote: >
      "中国人民大学政治学学科群自主知识体系创新学术报告会.md"包含"知识体系"关键词，
      被飞书同步逻辑匹配到跨集提炼子文件夹。
    generated_note_quote: >
      中国政经/跨集提炼下出现单篇报告会笔记，与合成文档混在一起。
    root_cause: >
      飞书同步的 _match_leaf 函数用 *知识体系* 通配符判断是否放入跨集提炼。
      但"知识体系"也可能出现在单篇笔记的标题中（如会议名称）。
    derived_rule: "文件命名规范"
    lesson: >
      【教训】文件名中的关键词会影响飞书分类。
      "知识体系"应只用于合成文档，单篇笔记应避免使用。
      【对策】
      - 合成文档命名规范：{域ID}-知识体系.md
      - 单篇笔记避免在文件名中使用"知识体系"/"跨集"/"提炼"等关键词
      - 或在同步逻辑中用更精确的匹配（如正则 ^.*-知识体系.*\.md$）

  - id: "EXP-016"
    date: "2026-06-22"
    source_note: "代理安全过滤根因分析"
    error_type: "代理模型服务端安全过滤误判"
    severity: "medium"
    original_text_quote: >
      cc-switch 代理（127.0.0.1:15721）路由到 mimo API，
      mimo API 对公开内容（地缘政治、经济分析等）触发安全过滤。
    generated_note_quote: >
      The request was rejected because it was considered high risk
    root_cause: >
      安全过滤发生在 mimo API 服务端（token-plan-sgp.xiaomimimo.com），
      不在 cc-switch 代理层。cc-switch 是纯路由，无 safety_level 配置。
      mimo 模型对某些话题（地缘政治、中美关系等）有过度敏感的安全策略。
    derived_rule: "代理架构认知"
    lesson: >
      【教训】cc-switch 无内容过滤能力，安全过滤由上游模型 API 控制。
      切换代理工具时需确认新工具有无类似限制。
      【对策】
      - 代码层面：自适应过滤器 + 重试机制（已实现）
      - prompt 层面：内容来源声明（已实现）
      - 架构层面：如 mimo 持续误判，切换到 cc-switch 中的其他 provider（如 deepseek）
      - config 中已记录代理架构说明，切换模型时必读

# ----------------------------------------------------------
# 经验总结（注入 prompt 时使用）
# ----------------------------------------------------------
summary_for_prompt: |
  ## 历史经验教训（请务必避免以下错误）

  1. **不要编造数字**：原文只说了"压力大"，就不要写成"压力占40%"
  2. **不要替嘉宾补充内容**：原文没给的策略建议，你就别加
  3. **不要翻转语义**：原文说"不可解释因子占主流"，就别写成"可解释性强"
  4. **不要丢弃关键限定词**：T0=中低频长周期预测，不是简单的"日内交易"
  5. **不要遗漏重要议题**：对照原文章节列表检查，确保至少覆盖80%
  6. **不要术语表和正文矛盾**：写完全文后回头检查术语表是否正确
  7. **不要虚构时序**：原文没说先后顺序，笔记不要自己编排"第一步→第二步"
  8. **不要张冠李戴**：引用某人的观点时，确保人名归属正确
  9. **区分引用原话和总结**：讲师的夸张表述加引号，不要当作客观事实写入总结
